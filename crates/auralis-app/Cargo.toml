[package]
name = "acustia-player"
description = "Acustia Player: reproductor de música local (v0.0.1 Alpha)"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true
build = "build.rs"

[[bin]]
name = "acustia-player"
path = "src/main.rs"

[dependencies]
auralis-core = { workspace = true }
auralis-library = { workspace = true }
auralis-player = { workspace = true }
slint = "1"
# Diálogo nativo para elegir carpeta (Windows, macOS, Linux).
rfd = "0.15"

[target.'cfg(windows)'.dependencies]
# Icono de bandeja del sistema (solo Windows en esta versión).
tray-icon = "0.19"
# Atajos globales de teclado y teclas multimedia (solo Windows en esta versión).
global-hotkey = "0.6"
# Decodifica el PNG del logo para el icono de la bandeja (solo PNG, sin extras).
image = { version = "0.25", default-features = false, features = ["png"] }

[build-dependencies]
slint-build = "1"
# Incrusta el icono (assets/icon.ico) en el .exe de Windows.
winresource = "0.1"
