[package]
name = "auralis-library"
description = "Escaneo de carpetas y lectura básica de etiquetas/carátulas de Auralis"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
auralis-core = { workspace = true }
symphonia = { workspace = true }
# Solo JPEG y PNG para las carátulas incrustadas (sin características por defecto).
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
# Lectura y escritura de etiquetas (ID3v2, Vorbis/FLAC, RIFF/AIFF) incluida la carátula.
lofty = "0.22"
# El escaneo corre con prioridad baja para no competir con la reproducción.
thread-priority = "1"
